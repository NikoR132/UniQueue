<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชำระเงิน – UniQueue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJqzmcjSLBT6W4agU8QzU_IP9NdWJLEJk",
            authDomain: "dwdwdw-2d303.firebaseapp.com",
            projectId: "dwdwdw-2d303",
            storageBucket: "dwdwdw-2d303.firebasestorage.app",
            messagingSenderId: "989547762601",
            appId: "1:989547762601:web:160638d280f1b01c8e2ab8",
            measurementId: "G-EZW78H155D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db; // ทำให้เรียกใช้ในฟังก์ชันได้
        window.addDoc = addDoc;
        window.collection = collection;
        window.serverTimestamp = serverTimestamp;
    </script>
    <style>
    :root {
      --cream:    #FDF6EC;
      --paper:    #FFFFFF;
      --terra:    #C8522A;
      --terra-dk: #A8391A;
      --amber:    #E8912A;
      --sage:     #7A9E7E;
      --ink:      #2C1810;
      --muted:    #9C8070;
      --border:   #E8D5BC;
      --r: 20px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Sarabun', sans-serif;
      background: var(--cream);
      color: var(--ink);
      padding: 20px 16px 100px;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: 'Space Mono', monospace; }

    .container { max-width: 480px; margin: 0 auto; }

    .page-head { text-align: center; margin-bottom: 18px; }
    .page-eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--terra);
      margin-bottom: 4px;
    }
    .page-head h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--ink); }

    /* ---------- Order ticket ---------- */
    .ticket {
      background: var(--paper);
      border-radius: var(--r);
      padding: 18px 18px 4px;
      box-shadow: 0 6px 18px rgba(44,24,16,0.06);
      margin-bottom: 18px;
    }
    .ticket-shop {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 12px;
      border-bottom: 2px dashed var(--border);
      font-weight: 700;
      color: var(--ink);
    }
    .ticket-shop .ic {
      width: 32px; height: 32px; border-radius: 10px;
      background: #FFF1E6; display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .order-item {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 0.92rem;
    }
    .order-item:last-of-type { border-bottom: none; }
    .oi-name { color: var(--ink); }
    .oi-qty { color: var(--muted); font-size: 0.82rem; }
    .oi-price { font-weight: 600; white-space: nowrap; }

    .perf {
      position: relative; height: 14px; margin: 0 -18px;
      background:
        radial-gradient(circle 7px at 0 0, transparent 7px, var(--cream) 7.5px) top left,
        radial-gradient(circle 7px at 100% 0, transparent 7px, var(--cream) 7.5px) top right;
      background-repeat: no-repeat;
    }
    .perf::after {
      content: ''; position: absolute; left: 18px; right: 18px; top: 0;
      border-top: 2px dashed var(--border);
    }

    .total-price {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 18px;
      background: var(--paper);
      border-radius: var(--r);
      margin-bottom: 18px;
      box-shadow: 0 6px 18px rgba(44,24,16,0.06);
    }
    .total-price .tl-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    .total-price .tl-value { font-size: 1.5rem; font-weight: 700; color: var(--terra); }

    /* ---------- Payment method ---------- */
    .section-label {
      font-size: 0.82rem; font-weight: 700; color: var(--muted);
      margin: 4px 2px 10px;
    }
    .method-box { margin-bottom: 18px; }
    .pay-option {
      display: flex; align-items: center; gap: 12px;
      padding: 14px; margin-bottom: 10px;
      background: var(--paper);
      border: 2px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .pay-option:active { transform: scale(0.99); }
    .pay-option:has(input:checked) {
      border-color: var(--terra);
      background: #FFF6EE;
      box-shadow: 0 0 0 3px rgba(200,82,42,0.08);
    }
    .pay-option .ic {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--cream); display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; flex-shrink: 0;
    }
    .pay-option input { width: 18px; height: 18px; accent-color: var(--terra); flex-shrink: 0; }
    .pay-option .txt { font-weight: 600; font-size: 0.92rem; }
    .pay-option .sub { font-size: 0.76rem; color: var(--muted); font-weight: 400; margin-top: 1px; }

    #qrCodeArea {
      display: none;
      text-align: center;
      background: var(--paper);
      border: 1.5px dashed var(--border);
      border-radius: var(--r);
      padding: 18px;
      margin-bottom: 18px;
    }
    #qrCodeArea p { margin: 0 0 12px; font-size: 0.86rem; color: var(--muted); font-weight: 600; }
    img.qr { width: 190px; border: 2px solid var(--border); border-radius: 12px; }

    /* ---------- Sticky action bar ---------- */
    .action-bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--paper);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 24px rgba(44,24,16,0.08);
    }
    .action-bar-inner { max-width: 480px; margin: 0 auto; display: flex; gap: 10px; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--terra);
      color: white;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      font-family: 'Sarabun', sans-serif;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      flex: 1;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
    }
    .btn:hover { background: var(--terra-dk); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
    .btn-back {
      background: none;
      color: var(--muted);
      flex: 0 0 auto;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
    }
    .btn-back:hover { background: none; border-color: var(--terra); color: var(--terra-dk); }

    /* ---------- Toast notifications ---------- */
    .toast-stack {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 5000; display: flex; flex-direction: column; gap: 8px;
      width: min(92vw, 380px); pointer-events: none;
    }
    .toast {
      background: var(--ink); color: #fff; padding: 13px 16px;
      border-radius: 12px; font-size: 0.88rem; font-weight: 600;
      box-shadow: 0 10px 28px rgba(44,24,16,0.28);
      display: flex; align-items: center; gap: 10px;
      opacity: 0; transform: translateY(-12px) scale(0.98);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: auto;
    }
    .toast.show { opacity: 1; transform: translateY(0) scale(1); }
    .toast.success { background: var(--sage); }
    .toast.error { background: var(--terra-dk); }

    /* ---------- QR reveal ---------- */
    #qrCodeArea { transition: opacity 0.2s ease, transform 0.2s ease; }
    #qrCodeArea.hiding { opacity: 0; transform: translateY(-6px); }
    
    /* ---------- PromptPay amount + slip ---------- */
    .amount-box {
      background: #FFF4E8; border: 1.5px solid var(--border);
      border-radius: 14px; padding: 12px 14px; margin-bottom: 14px;
    }
    .amount-label { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
    .amount-value { font-size: 2rem; font-weight: 700; color: var(--terra); line-height: 1.2; }
    .amount-note { font-size: 0.8rem; color: var(--terra-dk); font-weight: 600; margin-top: 4px; }
    #qrBox { display: inline-block; padding: 10px; background: #fff; border: 2px solid var(--border); border-radius: 12px; min-width: 60px; }
    #qrBox img { display: block; }
    .qr-missing { padding: 18px 8px; font-size: 0.86rem; color: var(--terra-dk); font-weight: 600; line-height: 1.5; }
    .slip-box { margin-top: 16px; padding-top: 14px; border-top: 1.5px dashed var(--border); text-align: center; }
    .slip-box.need { animation: shake 0.35s; }
    .slip-box.need .slip-pick { border-color: var(--terra); color: var(--terra-dk); }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .slip-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; }
    .slip-title .req { color: var(--terra); font-size: 0.78rem; }
    .slip-pick {
      display: block; padding: 12px; border: 1.5px dashed var(--border); border-radius: 12px;
      color: var(--muted); font-weight: 600; font-size: 0.88rem; cursor: pointer; background: var(--paper);
    }
    .slip-pick:hover { border-color: var(--terra); color: var(--terra-dk); }
    .slip-preview { display: block; max-width: 100%; max-height: 260px; margin: 10px auto 0; border-radius: 10px; border: 2px solid var(--border); }
    .slip-hint { font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-head">
            <div class="page-eyebrow">Confirm &amp; Pay</div>
            <h1>ยืนยันการชำระเงิน</h1>
        </div>

        <div class="ticket">
            <div id="paymentDetails">กำลังโหลดรายการ...</div>
            <div class="perf" id="perfSpacer" style="display:none;"></div>
        </div>

        <div class="total-price">
            <span class="tl-label">ยอดชำระทั้งหมด</span>
            <span class="tl-value mono" id="totalDisplay">฿0</span>
        </div>

        <div class="section-label">เลือกวิธีการชำระเงิน</div>
        <div class="method-box">
            <label class="pay-option">
                <span class="ic">📱</span>
                <input type="radio" name="payMethod" value="promptpay" onclick="togglePay(true)" checked>
                <span>
                    <div class="txt">คิวอาร์พร้อมเพย์ (PromptPay)</div>
                    <div class="sub">สแกนจ่ายผ่านแอปธนาคาร</div>
                </span>
            </label>
            <label class="pay-option">
                <span class="ic">💵</span>
                <input type="radio" name="payMethod" value="cash" onclick="togglePay(false)">
                <span>
                    <div class="txt">จ่ายเงินสดที่ร้าน (Cash)</div>
                    <div class="sub">ชำระเมื่อไปรับอาหาร</div>
                </span>
            </label>
        </div>

        <div id="qrCodeArea">
            <div class="amount-box">
                <div class="amount-label">ยอดที่ต้องโอน</div>
                <div class="amount-value mono" id="payAmount">฿0.00</div>
                <div class="amount-note">⚠️ โอนให้ตรงตามยอดนี้เท่านั้น ห้ามโอนขาดหรือเกิน</div>
            </div>
            <p>สแกนคิวอาร์พร้อมเพย์เพื่อโอนเงิน</p>
            <div id="qrBox"></div>
            <div class="slip-box" id="slipBox">
                <div class="slip-title">📎 แนบสลีปการโอนเงิน <span class="req">*จำเป็น</span></div>
                <input type="file" id="slipInput" accept="image/*" hidden>
                <label for="slipInput" class="slip-pick" id="slipPick">เลือกรูปสลีปจากเครื่อง</label>
                <img id="slipPreview" class="slip-preview" alt="ตัวอย่างสลีป" style="display:none">
                <div class="slip-hint" id="slipHint">ร้านจะตรวจยอดจากสลีปก่อนเริ่มทำอาหาร</div>
            </div>
        </div>
    </div>

    <div class="action-bar">
        <div class="action-bar-inner">
            <button class="btn-back" style="border-radius:12px;" onclick="history.back()" aria-label="กลับไปแก้ไข">←</button>
            <button class="btn" onclick="confirmOrder()">✅ ยืนยันออเดอร์</button>
        </div>
    </div>

    <script>
        function showToast(msg, type) {
            let stack = document.getElementById('toastStack');
            if (!stack) {
                stack = document.createElement('div');
                stack.id = 'toastStack';
                stack.className = 'toast-stack';
                document.body.appendChild(stack);
            }
            const t = document.createElement('div');
            t.className = 'toast' + (type ? ' ' + type : '');
            t.textContent = msg;
            stack.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => {
                t.classList.remove('show');
                setTimeout(() => t.remove(), 250);
            }, 3200);
        }

        const CART_KEY = 'uniQueueCart';
        const params = new URLSearchParams(window.location.search);
        const targetShopId = params.get('shopId');

        // ===== ตั้งค่าบัญชีพร้อมเพย์ของแต่ละร้าน =====
        // ใส่เบอร์โทร 10 หลัก หรือเลขบัตรประชาชน 13 หลักของร้าน เช่น { shop1: '0812345678' }
        // QR ที่สร้างจะฝังยอดเงินไว้ให้ ทำให้แอปธนาคารล็อกยอดตามออเดอร์
        const PROMPTPAY_IDS = {
            // shop1: '0812345678',
        };
        const DEFAULT_PROMPTPAY_ID = '';

        let slipData = null;      // รูปสลีปที่ย่อแล้ว (data URL)
        let qrReady = false;

        function tlv(id, val) { return id + String(val.length).padStart(2, '0') + val; }
        function crc16(str) {
            let crc = 0xFFFF;
            for (let i = 0; i < str.length; i++) {
                crc ^= str.charCodeAt(i) << 8;
                for (let b = 0; b < 8; b++) {
                    crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
                    crc &= 0xFFFF;
                }
            }
            return crc.toString(16).toUpperCase().padStart(4, '0');
        }
        function buildPromptPayPayload(rawId, amount) {
            const id = String(rawId).replace(/\D/g, '');
            let tag, target;
            if (id.length >= 15) { tag = '03'; target = id; }
            else if (id.length >= 13) { tag = '02'; target = id; }
            else { tag = '01'; target = ('0066' + id.replace(/^0/, '')).padStart(13, '0'); }
            const merchant = tlv('00', 'A000000677010111') + tlv(tag, target);
            let p = tlv('00', '01') + tlv('01', amount ? '12' : '11') + tlv('29', merchant)
                  + tlv('58', 'TH') + tlv('53', '764') + (amount ? tlv('54', Number(amount).toFixed(2)) : '');
            p += '6304';
            return p + crc16(p);
        }

        function renderQr(total) {
            const box = document.getElementById('qrBox');
            box.innerHTML = '';
            qrReady = false;
            const ppId = PROMPTPAY_IDS[targetShopId] || DEFAULT_PROMPTPAY_ID;
            if (!ppId) {
                box.innerHTML = '<div class="qr-missing">ร้านนี้ยังไม่ได้ตั้งค่าบัญชีพร้อมเพย์<br>กรุณาเลือกจ่ายเงินสดที่ร้านแทน</div>';
                return;
            }
            if (typeof QRCode === 'undefined') {
                box.innerHTML = '<div class="qr-missing">โหลดตัวสร้าง QR ไม่สำเร็จ กรุณารีเฟรชหน้านี้</div>';
                return;
            }
            new QRCode(box, { text: buildPromptPayPayload(ppId, total), width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
            qrReady = true;
        }

        // ย่อรูปสลีปก่อนเก็บลง Firestore (เอกสารหนึ่งใบจุได้ไม่เกิน ~1MB)
        function compressSlip(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const MAX = 1280;
                    const scale = Math.min(1, MAX / Math.max(img.width, img.height));
                    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
                    const c = document.createElement('canvas');
                    c.width = w; c.height = h;
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    URL.revokeObjectURL(url);
                    let q = 0.72, out = c.toDataURL('image/jpeg', q);
                    while (out.length > 700000 && q > 0.35) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
                    out.length > 700000 ? reject(new Error('รูปใหญ่เกินไป')) : resolve(out);
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('อ่านรูปไม่ได้')); };
                img.src = url;
            });
        }

        document.getElementById('slipInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const preview = document.getElementById('slipPreview');
            const pick = document.getElementById('slipPick');
            slipData = null;
            preview.style.display = 'none';
            if (!file) { pick.textContent = 'เลือกรูปสลีปจากเครื่อง'; return; }
            if (!file.type.startsWith('image/')) {
                showToast('❌ กรุณาเลือกไฟล์รูปภาพเท่านั้น', 'error');
                e.target.value = ''; return;
            }
            try {
                slipData = await compressSlip(file);
                preview.src = slipData;
                preview.style.display = 'block';
                pick.textContent = '🔄 เปลี่ยนรูปสลีป';
            } catch (err) {
                showToast('❌ แนบสลีปไม่สำเร็จ: ' + err.message, 'error');
                e.target.value = '';
            }
        });

        function loadPaymentInfo() {
            const cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            const shopItems = cart.filter(item => item.shopId == targetShopId);
            if (shopItems.length === 0) {
                document.getElementById('paymentDetails').innerHTML = "ไม่พบรายการของร้านนี้";
                return;
            }
            let html = `<div class="ticket-shop"><span class="ic">🏪</span><span>${shopItems[0].shopName}</span></div>`;
            let total = 0;
            shopItems.forEach(item => {
                total += (item.price * item.qty);
                html += `<div class="order-item"><span class="oi-name">${item.menu} <span class="oi-qty">x${item.qty}</span></span> <span class="oi-price mono">฿${item.price * item.qty}</span></div>`;
            });
            document.getElementById('paymentDetails').innerHTML = html;
            document.getElementById('perfSpacer').style.display = 'block';
            document.getElementById('totalDisplay').textContent = "฿" + total;
            document.getElementById('payAmount').textContent = "฿" + total.toFixed(2);
            renderQr(total);
        }

        function togglePay(showQr) {
            const el = document.getElementById('qrCodeArea');
            if (showQr) {
                el.style.display = 'block';
                el.classList.add('hiding');
                requestAnimationFrame(() => el.classList.remove('hiding'));
            } else {
                el.classList.add('hiding');
                setTimeout(() => { el.style.display = 'none'; }, 180);
            }
        }

        async function confirmOrder() {
            // 👤 ดึงข้อมูลผู้ใช้ที่ล็อกอินอยู่จาก localStorage
            const currentUser = JSON.parse(localStorage.getItem('uniQueueUser')) || null;
            if (!currentUser || !currentUser.telegramChatId) {
                showToast('❌ ไม่พบข้อมูลผู้ใช้ กรุณาเข้าสู่ระบบใหม่อีกครั้งที่หน้าแรก', 'error');
                setTimeout(() => { window.location.href = "index.html"; }, 900);
                return;
            }

            const cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            const shopItems = cart.filter(item => item.shopId == targetShopId);
            if (shopItems.length === 0) {
                showToast('❌ ไม่พบรายการของร้านนี้ในตะกร้าแล้ว', 'error');
                return;
            }
            const total = shopItems.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const method = document.querySelector('input[name="payMethod"]:checked').value;

            // 💳 จ่ายด้วย QR: ต้องมี QR ที่ใช้ได้ และต้องแนบสลีปก่อนส่งออเดอร์
            if (method === 'promptpay') {
                if (!qrReady) {
                    showToast('❌ ร้านนี้ยังรับโอนไม่ได้ กรุณาเลือกจ่ายเงินสดที่ร้าน', 'error');
                    return;
                }
                if (!slipData) {
                    const box = document.getElementById('slipBox');
                    box.classList.remove('need'); void box.offsetWidth; box.classList.add('need');
                    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    showToast('📎 กรุณาโอนเงินให้ครบตามยอด แล้วแนบสลีปก่อนยืนยันออเดอร์', 'error');
                    return;
                }
            }

            // 🏪 ออเดอร์ของแต่ละร้านจะถูกเก็บแยกคอลเล็กชันตาม shopId เช่น orders_shop1, orders_shop2
            // เพื่อให้ตรงกับที่หน้าหลังบ้านของแต่ละร้าน (เช่น ...หลังบ้าน.html) อ่านข้อมูลอยู่
            const collectionName = `orders_${targetShopId}`;

            const orderData = {
                customer: currentUser.displayName,
                telegramId: currentUser.telegramChatId,
                shopId: targetShopId,
                shopName: shopItems[0].shopName,
                items: shopItems,
                price: total,
                paymentMethod: method, // 'promptpay' หรือ 'cash'
                paymentStatus: method === 'promptpay' ? 'pending_verify' : 'pay_at_shop',
                expectedAmount: total,
                ...(method === 'promptpay' ? { slipImage: slipData } : {}),
                status: "waiting",
                timestamp: window.serverTimestamp()
            };

            const btn = document.querySelector('.btn');
            if (btn) { btn.disabled = true; btn.textContent = '⏳ กำลังส่งออเดอร์...'; }

            try {
                // บันทึกลง Firestore ใน Collection ของร้านนั้นๆ โดยเฉพาะ
                await window.addDoc(window.collection(window.db, collectionName), orderData);

                // ลบเฉพาะของร้านนี้ออกจากตะกร้า
                const remaining = cart.filter(item => item.shopId != targetShopId);
                localStorage.setItem(CART_KEY, JSON.stringify(remaining));

                showToast('✅ ออเดอร์ถูกส่งไปยังร้านค้าแล้ว!', 'success');
                setTimeout(() => { window.location.href = "index.html"; }, 900);
            } catch (e) {
                showToast('เกิดข้อผิดพลาด: ' + e.message, 'error');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '✅ ยืนยันออเดอร์'; }
            }
        }

        loadPaymentInfo();
        togglePay(true);
    </script>
</body>
</html>
